[workspace]

[package]
name = "agent-send-desktop"
version = "0.1.0"
edition = "2021"
authors = ["agent-send contributors"]
description = "Tauri desktop shell for agent-send"
license = "MIT OR Apache-2.0"

[lib]
name = "agent_send_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
