[workspace]
members = [
    "crates/agent-send-core",
    "crates/agent-send-daemon",
    "crates/agent-send-cli",
    "crates/agent-send-mcp",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
chacha20poly1305 = "0.10"
mdns-sd = "0.11"
hkdf = "0.12"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
